    name: Scheduled Python Script

    on: 
      schedule:
        - cron: '1 */4 * * *' # Runs every 4hrs at Minute 1 
        #- cron: '*/30 * * * *' # Runs every 15 mins
    

    permissions:
         contents:  write


    jobs:
      run-script:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v5

          #- name: Set up Python
            #uses: actions/setup-python@v5
            #with:
              #python-version: '3.x' # Specify your Python version

          - name: Install dependencies
            run: |
              pip install -r requirements.txt # If you have a requirements.txt
              sudo apt update
              sudo apt install tesseract-ocr  # Install tesseract
              playwright install --with-deps # Install Playwright

              

          - name: Run Python script
            run: python spocr01.py

          - name: Auto Commit
            uses: stefanzweifel/git-auto-commit-action@v7
            with:
                commit_message: Files Commit Changes

                
